name: Bug report
description: Report fork behaviour not working as expected
labels:
  - "Type: Fix"
  - "Status: Unconfirmed"
body:
  - type: markdown
    attributes:
      value: |
        Use this for actionable bugs in this fork.
        For Minecraft Bedrock client compatibility, use the protocol compatibility template.
        For plugin compatibility regressions, use the plugin compatibility template.

  - type: markdown
    attributes:
      value: |
        ## Plugin information

        > [!IMPORTANT]
        > It's strongly recommended to test for bugs without plugins before reporting an issue.
        > This helps avoid wasting maintainers' time on bugs that are not actually caused by PocketMine-MP.
        >
        > If you're not sure whether a plugin might be causing your issue, please test without plugins before writing an issue.

  - type: dropdown
    attributes:
      label: Plugin information
      options:
        - "I haven't tested without plugins"
        - Bug happens without plugins
        - Bug only happens with certain plugins (describe below)
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Bug description

        > [!TIP]
        > Helpful information to include:
        > - Steps to reproduce the issue
        > - Error backtraces
        > - Crashdumps
        > - Plugin code that triggers the issue
        > - List of installed plugins (use /plugins)

        > [!IMPORTANT]
        > **Steps to reproduce are critical to finding the cause of the problem!**
        > Without reproducing steps, the issue will probably not be solvable and may be closed.

  - type: textarea
    attributes:
      label: Problem description
      description: Describe the problem, and how you encountered it
      placeholder: e.g. Steps to reproduce the issue
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      description: Provide the smallest set of steps needed to reproduce this bug.
    validations:
      required: true
  - type: input
    attributes:
      label: Last known working version or commit
      description: If this is a regression, include the last known working version or commit.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## Version, OS and game info
        > [!WARNING]
        > "Latest" is not a valid version.
        > Failure to fill these fields with valid information may result in your issue being closed.

  - type: input
    attributes:
      label: PocketMine-MP version
      placeholder: Use the /version command in PocketMine-MP
    validations:
      required: true
  - type: input
    attributes:
      label: PHP version
      placeholder: Use the /version command in PocketMine-MP
    validations:
      required: true
  - type: input
    attributes:
      label: Server OS
      placeholder: Use the /version command in PocketMine-MP
    validations:
      required: true
  - type: input
    attributes:
      label: Game version (if applicable)
      placeholder: e.g. Android, iOS, Windows, Xbox, PS4, Switch
    validations:
      required: false
